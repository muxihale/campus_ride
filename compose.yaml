name: campusride

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusride_local}
      POSTGRES_DB: ${POSTGRES_DB:-campusride}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-campusride}:${POSTGRES_PASSWORD:-campusride_local}@db:5432/${POSTGRES_DB:-campusride}?schema=public
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://localhost:3001/api/health/ready'); process.exit(r.ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  web:
    build:
      context: .
      target: web
    environment:
      API_PROXY_TARGET: http://api:3001
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
